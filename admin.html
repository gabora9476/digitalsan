<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>DigitalSAN · Panel administrador</title>
<meta name="theme-color" content="#070c16">
<link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="./assets/img/favicon-32.png?v=2">
<link rel="shortcut icon" href="./assets/img/favicon.ico?v=2">
<link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/styles.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49"></script>
</head>
<body>
<div class="app-shell">

  <div class="app-topbar">
    <div class="row">
      <div class="brand">
        <div class="logo-dot">DS</div>
        <div><strong>DigitalSAN</strong><span id="saludo">Administración</span></div>
      </div>
      <div class="rate-chip" id="rateChip"></div>
    </div>
  </div>

  <div class="page">

    <!-- ============ RESUMEN ============ -->
    <section id="viewResumen">
      <div class="stat-grid">
        <div class="glass stat-card"><div class="v" id="statCreadores">0</div><div class="l">Creadores</div></div>
        <div class="glass stat-card"><div class="v" id="statParticipantesGlobal">0</div><div class="l">Participantes</div></div>
        <div class="glass stat-card"><div class="v" id="statSanesGlobal">0</div><div class="l">San activos</div></div>
        <div class="glass stat-card"><div class="v" id="statMontoGlobal">$0</div><div class="l">Movido en San</div></div>
      </div>

      <div class="glass mt-12">
        <div class="card-title">Tasa USDT / VES</div>
        <p class="muted" style="font-size:12px;">Se obtiene automáticamente (referencia del mercado paralelo). Si la API falla, se usa este respaldo manual.</p>
        <div class="field mt-8"><label>Tasa manual de respaldo (Bs. por USDT)</label>
          <div class="flex gap-8"><input type="number" step="0.01" min="0" id="tasaManual"><button class="btn btn-gold" id="btnGuardarTasa">Guardar</button></div>
        </div>
      </div>
    </section>

    <!-- ============ CREADORES ============ -->
    <section id="viewCreadores" class="hidden">
      <button class="btn btn-primary btn-block" onclick="abrirCrearCreador()">+ Nuevo creador</button>
      <div class="list mt-12" id="listaCreadores"></div>
    </section>

    <!-- ============ SANES ============ -->
    <section id="viewSanesGlobal" class="hidden">
      <div class="list" id="listaSanesGlobal"></div>
    </section>

    <!-- ============ PERFIL ============ -->
    <section id="viewPerfil" class="hidden">
      <div class="glass text-center">
        <div class="avatar" style="width:52px;height:52px;font-size:16px;margin:0 auto;" id="avatarPerfil"></div>
        <h3 class="mt-8" id="nombrePerfil">—</h3>
        <p class="muted" id="emailPerfil">—</p>
      </div>
      <button class="btn btn-danger btn-block mt-12" onclick="cerrarSesion()">Cerrar sesión</button>
    </section>

  </div>

  <div class="app-footer">
    © <span id="anio"></span> DigitalSAN · Powered by <a id="linkAutor" href="#" target="_blank">gabora646</a>
  </div>
</div>

<div class="bottom-nav">
  <div class="bar">
    <button class="nav-btn active" data-view="Resumen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V10M12 19V5M20 19v-6"/></svg>
      <span>Resumen</span>
    </button>
    <button class="nav-btn" data-view="Creadores">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span>Creadores</span>
    </button>
    <button class="nav-btn" data-view="SanesGlobal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span>San</span>
    </button>
    <button class="nav-btn" data-view="Perfil">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 6 6 1-4.5 4.5L18 20l-6-3-6 3 1.5-6.5L3 9l6-1z"/></svg>
      <span>Perfil</span>
    </button>
  </div>
</div>

<script src="./assets/js/config.js?v=2"></script>
<script src="./assets/js/utils.js?v=2"></script>
<script src="./assets/js/auth.js?v=2"></script>
<script src="./assets/js/rate-service.js?v=2"></script>
<script>
document.getElementById('anio').textContent = new Date().getFullYear();
document.getElementById('linkAutor').href = linkWhatsapp(APP_INFO.soporteWhatsapp, 'Hola, vengo de DigitalSAN 👋');

let perfil = null;
let creadores = [];
let participantesAll = [];
let sanesGlobal = [];

async function init() {
  perfil = await requerirRol('admin');
  if (!perfil) return;
  document.getElementById('nombrePerfil').textContent = perfil.nombre_completo;
  document.getElementById('avatarPerfil').textContent = iniciales(perfil.nombre_completo);
  document.getElementById('emailPerfil').textContent = perfil.email || '';

  renderRateChip('rateChip');

  try {
    const { data: cfg } = await supabaseClient.from('configuracion').select('valor').eq('clave', 'tasa_manual_usdt').maybeSingle();
    document.getElementById('tasaManual').value = cfg && Number(cfg.valor) ? cfg.valor : '';
  } catch (e) { /* no crítico */ }

  await cargarTodo();
}

async function cargarTodo() {
  const [rPerfiles, rSanes] = await Promise.all([
    supabaseClient.from('perfiles').select(PERFIL_COLS).in('rol', ['creador', 'participante']).order('created_at', { ascending: false }),
    supabaseClient.from('sanes').select('*, perfiles!creador_id(nombre_completo)').order('created_at', { ascending: false })
  ]);
  if (rPerfiles.error) { console.error(rPerfiles.error); toast('No se pudieron cargar los usuarios: ' + rPerfiles.error.message, 'error'); }
  if (rSanes.error) { console.error(rSanes.error); toast('No se pudieron cargar los San: ' + rSanes.error.message, 'error'); }

  const todos = rPerfiles.data || [];
  creadores = todos.filter(p => p.rol === 'creador');
  participantesAll = todos.filter(p => p.rol === 'participante');
  sanesGlobal = rSanes.data || [];

  const vigentes = sanesGlobal.filter(s => s.estado !== 'cancelado');
  document.getElementById('statCreadores').textContent = creadores.length;
  document.getElementById('statParticipantesGlobal').textContent = participantesAll.length;
  document.getElementById('statSanesGlobal').textContent = sanesGlobal.filter(s => s.estado === 'activo').length;
  document.getElementById('statMontoGlobal').textContent = formatoUSD(vigentes.reduce((acc, s) => acc + Number(s.monto_total || 0), 0));

  renderCreadores();
  renderSanesGlobal();
}

/* ============ Creadores ============ */

function renderCreadores() {
  const list = document.getElementById('listaCreadores');
  if (!creadores.length) { list.innerHTML = `<div class="empty"><div class="ico">🧑‍💼</div><b>Sin creadores registrados</b><p>Agrega el primero para que pueda crear sus San.</p></div>`; return; }
  list.innerHTML = creadores.map(c => {
    const nSan = sanesGlobal.filter(s => s.creador_id === c.id).length;
    const nPart = participantesAll.filter(p => p.creado_por === c.id).length;
    return `
    <div class="item-row">
      <div class="avatar">${esc(iniciales(c.nombre_completo))}</div>
      <div class="meta"><b>${esc(c.nombre_completo)}</b><small>${esc(c.email || '')} · ${esc(c.whatsapp)}</small><small style="display:block;">${nSan} San · ${nPart} participantes</small></div>
      <div class="actions">
        <span class="badge ${c.activo ? 'badge-success' : 'badge-danger'}">${c.activo ? 'Activo' : 'Inactivo'}</span>
        <button class="btn btn-icon btn-ghost" title="Activar / desactivar" onclick="toggleActivoCreador('${c.id}')">⏻</button>
      </div>
    </div>`;
  }).join('');
}

function abrirCrearCreador() {
  abrirSheet(`
    <div class="sheet-header"><h3>Nuevo creador</h3><button class="btn btn-icon btn-ghost" onclick="cerrarOverlay(this)">✕</button></div>
    <form id="formCrearCreador">
      <div class="field"><label>Nombre completo</label><input type="text" id="cNombre" required></div>
      <div class="field"><label>Correo (será su usuario)</label><input type="email" id="cEmail" required></div>
      <div class="field"><label>WhatsApp</label><input type="text" id="cWhatsapp" placeholder="0412-1234567" required></div>
      <div class="field"><label>Contraseña inicial (mín. 6)</label><input type="text" id="cPassword" minlength="6" value="${esc(generarPasswordTemporal())}" required></div>
      <details class="mb-8">
        <summary class="hint" style="cursor:pointer;">Avanzado: ya creé el usuario en Supabase</summary>
        <div class="field mt-8"><label>UUID del usuario (opcional)</label><input type="text" id="cUuid" placeholder="00000000-0000-0000-0000-000000000000"></div>
        <p class="hint">Si pegas el UUID no se crea ningún usuario nuevo: solo se vincula el perfil.</p>
      </details>
      <div class="error-text" id="errCrearCreador"></div>
      <button type="submit" class="btn btn-primary btn-block" id="btnCrearCreador">Registrar creador</button>
    </form>
  `);
  document.getElementById('formCrearCreador').addEventListener('submit', crearCreador);
}

async function crearCreador(e) {
  e.preventDefault();
  const $ = id => document.getElementById(id);
  const btn = $('btnCrearCreador');
  const errEl = $('errCrearCreador');
  errEl.textContent = '';
  botonCargando(btn, true);
  try {
    const nombre = $('cNombre').value.trim();
    const email = $('cEmail').value.trim();
    const whatsapp = $('cWhatsapp').value.trim();
    const password = $('cPassword').value;
    let uid = $('cUuid').value.trim();
    const usoUuid = !!uid;
    let requiereConfirmacion = false;

    if (uid && !/^[0-9a-fA-F-]{36}$/.test(uid)) throw new Error('El UUID no tiene un formato válido.');

    if (!uid) {
      if (password.length < 6) throw new Error('La contraseña debe tener al menos 6 caracteres.');
      // Cliente auxiliar: crea el usuario SIN tocar la sesión del administrador
      const aux = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'digitalsan-aux', lock: async (n, t, fn) => await fn() }
      });
      const { data, error } = await conTimeout(aux.auth.signUp({ email, password }), 20000, 'timeout');
      if (error) throw new Error(traducirErrorAuth(error));
      if (!data.user || (data.user.identities && data.user.identities.length === 0)) {
        throw new Error('Ese correo ya existe en Supabase. Pega su UUID en "Avanzado" para vincularlo.');
      }
      uid = data.user.id;
      requiereConfirmacion = !data.session;
    }

    const { error } = await supabaseClient.from('perfiles').insert({
      auth_user_id: uid, rol: 'creador', nombre_completo: nombre, email, whatsapp
    });
    if (error) throw new Error('No se pudo guardar el perfil: ' + error.message);

    cerrarTodosOverlays();
    toast('Creador registrado ✅', 'success');
    await cargarTodo();

    if (!usoUuid) {
      const mensaje = `Hola ${nombre} 👋, ya tienes acceso de *Creador* en DigitalSAN.\n\nCorreo: ${email}\nContraseña: ${password}\n\nEntra en la pestaña "Creador" de la página de inicio.`;
      abrirSheet(`
        <div class="sheet-header"><h3>Compartir acceso</h3></div>
        ${requiereConfirmacion ? `<p class="hint" style="color:var(--warn);">⚠️ Tu proyecto exige confirmar el correo: el creador recibió un email de confirmación. Si no llega, confírmalo en Supabase → Authentication → Users.</p>` : ''}
        <div class="glass tight mt-8 mono" style="font-size:12px;">Correo: ${esc(email)}<br>Clave: ${esc(password)}</div>
        <button class="btn btn-primary btn-block mt-12" data-href="${esc(linkWhatsapp(whatsapp, mensaje))}" onclick="window.open(this.dataset.href,'_blank')">Enviar por WhatsApp</button>
      `, { centered: true });
    }
  } catch (err) {
    errEl.textContent = err.message === 'timeout' ? 'El servidor tardó demasiado. Intenta de nuevo.' : err.message;
  } finally {
    botonCargando(btn, false, 'Registrar creador');
  }
}

async function toggleActivoCreador(id) {
  const c = creadores.find(x => x.id === id);
  if (!c) return;
  const { error } = await supabaseClient.from('perfiles').update({ activo: !c.activo }).eq('id', id);
  if (error) { toast('No se pudo actualizar: ' + error.message, 'error'); return; }
  toast(c.activo ? 'Creador desactivado' : 'Creador activado', 'success');
  await cargarTodo();
}

/* ============ San global ============ */

function renderSanesGlobal() {
  const list = document.getElementById('listaSanesGlobal');
  if (!sanesGlobal.length) { list.innerHTML = `<div class="empty"><div class="ico">📋</div><b>Sin San todavía</b></div>`; return; }
  list.innerHTML = sanesGlobal.map(s => {
    const est = ETIQUETAS_ESTADO_SAN[s.estado] || { texto: s.estado, clase: 'badge-muted' };
    return `
    <div class="glass tight">
      <div class="glass-row">
        <div><b style="font-size:13px;">${esc(s.nombre)}</b><div class="muted" style="font-size:11px;">Por ${esc(s.perfiles?.nombre_completo || '—')} · ${formatoUSD(s.monto_total)}</div></div>
        <span class="badge ${est.clase}">${est.texto}</span>
      </div>
    </div>`;
  }).join('');
}

/* ============ Configuración ============ */

document.getElementById('btnGuardarTasa').addEventListener('click', async () => {
  const valor = document.getElementById('tasaManual').value;
  const { error } = await guardarTasaManual(valor);
  if (error) { toast('No se pudo guardar: ' + error.message, 'error'); return; }
  toast('Tasa de respaldo guardada', 'success');
});

/* ============ Navegación ============ */

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    ['Resumen', 'Creadores', 'SanesGlobal', 'Perfil'].forEach(v => {
      document.getElementById('view' + v).classList.toggle('hidden', v !== btn.dataset.view);
    });
  });
});

init();
</script>
</body>
</html>
